<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proiect Practica - Auth & Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; color: #333; }
        input { display: block; width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .hidden { display: none; }
        .error { color: red; font-size: 14px; text-align: center; }
        .success { color: green; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <!-- Secțiunea de Autentificare și Înregistrare -->
    <div id="auth-section" class="card">
        <h2>Autentificare</h2>
        
        <!-- Formular Login -->
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Parolă">
        <button onclick="login()">Intră în cont (Login)</button>
        <p id="login-msg" class="error"></p>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

        <h2>Înregistrare</h2>
        <!-- Formular Register -->
        <input type="email" id="reg-email" placeholder="Email nou">
        <input type="password" id="reg-password" placeholder="Parolă nouă">
        <button onclick="register()">Creează cont (Register)</button>
        <p id="reg-msg" class="success"></p>
    </div>

    <!-- Panoul Protejat (Dashboard) -->
    <div id="dashboard-section" class="card hidden">
        <h2>Panou Protejat</h2>
        <p><strong>Email utilizator:</strong> <span id="user-email"></span></p>
        <p><strong>ID intern:</strong> <span id="user-id"></span></p>
        <button class="btn-danger" onclick="logout()">Ieși din cont (Logout)</button>
    </div>

    <script>
        // Adresa IP configurată direct pentru serverul tău AWS
        const API_URL = "http://3.71.96.40:8000";

        // La încărcarea paginii, verifică dacă există un token salvat în localStorage
        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (token) {
                fetchUserData(token);
            }
        };

        // Funcția de Înregistrare
        async function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('reg-msg');
            msgEl.innerText = "";

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    msgEl.innerText = "Cont creat cu succes! Te poți autentifica mai sus.";
                    document.getElementById('reg-email').value = "";
                    document.getElementById('reg-password').value = "";
                } else {
                    msgEl.className = "error";
                    msgEl.innerText = data.detail || "Eroare la înregistrare.";
                }
            } catch (err) {
                msgEl.className = "error";
                msgEl.innerText = "Eroare de conexiune cu serverul.";
            }
        }

        // Funcția de Autentificare (Login)
        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('login-msg');
            msgEl.innerText = "";

            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    fetchUserData(data.access_token);
                } else {
                    msgEl.innerText = data.detail || "Email sau parolă greșită.";
                }
            } catch (err) {
                msgEl.innerText = "Eroare de conexiune cu serverul.";
            }
        }

        // Preluarea datelor de pe ruta protejată /me
        async function fetchUserData(token) {
            try {
                const response = await fetch(`${API_URL}/me`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('user-email').innerText = user.email;
                    document.getElementById('user-id').innerText = user.id;

                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                } else {
                    logout();
                }
            } catch (err) {
                logout();
            }
        }

        // Funcția de Logout
        function logout() {
            localStorage.removeItem('access_token');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('login-email').value = "";
            document.getElementById('login-password').value = "";
        }
    </script>
</body>
</html>
